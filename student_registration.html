<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
        <p>Please complete the form below.</p>
    </header>

    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number" required>
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
                <br><br>

                <span>Gender:</span>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Course Information</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">-- Choose a course --</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="BSc">B.Sc.</option>
                    <option value="BCom">B.Com.</option>
                </select>
                <br><br>

                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" cols="35" placeholder="Enter your address"></textarea>
                <br><br>

                <label for="document">Upload Document:</label>
                <input type="file" id="document" name="document">
                <br><br>

                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">I confirm that the information provided is correct.</label>
            </fieldset>

            <br>
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </form>
    </main>

    <footer>
        <p>Student Registration Demo</p>
    </footer>
</body>
</html>
